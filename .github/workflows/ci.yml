name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[api,dev]'
      - run: ruff check src tests examples
      - run: mypy src/cohortseal
      - run: pytest --cov=cohortseal --cov-report=term-missing
      - run: python -m build
