[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cohortseal"
version = "0.1.0"
description = "Patient-aware split auditing and reproducible cohort manifests for medical imaging ML."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Arad Hosseini Moghaddam"}]
dependencies = ["pydantic>=2.7", "PyYAML>=6.0"]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
imaging = ["nibabel>=5.2", "pydicom>=2.4"]
dicom = ["pydicom>=2.4"]
monai = ["monai>=1.3"]
huggingface = ["huggingface_hub>=0.24"]
metrics = ["numpy>=1.26", "scipy>=1.12"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27", "build>=1.2"]

[project.scripts]
cohortseal = "cohortseal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cohortseal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["cohortseal"]
